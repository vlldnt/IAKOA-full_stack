name: CI

on:
  push:
    branches: [main, pre-prod]
  pull_request:

jobs:
  backend:
    name: Backend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iakoa_test
          POSTGRES_PASSWORD: iakoa_test
          POSTGRES_DB: iakoa-tests
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U iakoa_test -d iakoa-tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://iakoa_test:iakoa_test@127.0.0.1:5433/iakoa-tests?schema=public
      JWT_SECRET: ci-secret-key
      JWT_REFRESH_SECRET: ci-refresh-secret-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      # TODO: rendre bloquant une fois la dette ESLint historique résorbée
      - name: Lint (non bloquant)
        run: npx eslint "src/**/*.ts"
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Tests
        run: npx jest --ci

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # TODO: rendre bloquant une fois la dette ESLint historique résorbée
      - name: Lint (non bloquant)
        run: npm run lint
        continue-on-error: true

      - name: Build (tsc + vite)
        run: npm run build
